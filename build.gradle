plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

evaluationDependsOn(':common')
def commonMain = project(':common').extensions.getByType(SourceSetContainer).named('main')

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    source commonMain.get()
                }
            }
        }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server { property 'forge.enabledGameTestNamespaces', mod_id; args '--nogui' }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// 纯逻辑自测源集（不打包进 jar，也不需要任何测试框架依赖）
sourceSets {
    selftest {
        java.srcDir 'src/selftest/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = '运行纯逻辑自测器'
    classpath = sourceSets.selftest.runtimeClasspath
    mainClass = 'com.yztc.auth.selftest.SelfTestMain'
    // Windows 控制台默认 GBK，强制 UTF-8 让中文断言信息可读
    jvmArgs '-Dfile.encoding=UTF-8'
}

repositories {
    maven { url = 'https://libraries.minecraft.net/' }
    mavenCentral()
}

dependencies {
    implementation project(':common')
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation 'com.google.code.gson:gson:2.10.1'
}

tasks.named('processResources', ProcessResources).configure {
    // gradle.properties 里的中文在部分环境会被按非 UTF-8 读取，导致 mods.toml 显示名/描述乱码；
    // 这里显式按 UTF-8 重读，并把过滤读写字符集都钉成 UTF-8。
    var utf8 = new Properties()
    file('gradle.properties').withInputStream { is ->
        utf8.load(new InputStreamReader(is, java.nio.charset.StandardCharsets.UTF_8))
    }
    var replaceProperties = [
            minecraft_version: utf8.getProperty('minecraft_version'),
            minecraft_version_range: utf8.getProperty('minecraft_version_range'),
            forge_version: utf8.getProperty('forge_version'),
            forge_version_range: utf8.getProperty('forge_version_range'),
            loader_version_range: utf8.getProperty('loader_version_range'),
            mod_id: utf8.getProperty('mod_id'),
            mod_name: utf8.getProperty('mod_name'),
            mod_license: utf8.getProperty('mod_license'),
            mod_version: utf8.getProperty('mod_version'),
            mod_authors: utf8.getProperty('mod_authors'),
            mod_description: utf8.getProperty('mod_description'),
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties + [project: project] }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = "mc${minecraft_version}-forge"
    dependsOn ':common:classes'
    from { commonMain.get().output }
    from('LICENSE') { into 'META-INF'; rename { 'LICENSE-yzt_super.txt' } }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
        ])
    }
    finalizedBy 'reobfJar'
}

def forgeArchive = tasks.named('jar', Jar).flatMap { it.archiveFile }
tasks.register('verifyForgeJar') {
    group = 'verification'
    description = '检查 Forge 发行包是否包含全部公共类'
    dependsOn 'reobfJar'
    inputs.file forgeArchive
    doLast {
        def classes = commonMain.get().output.classesDirs.asFileTree.matching { include '**/*.class' }
        if (classes.isEmpty()) throw new GradleException('公共模块没有编译输出')
        new java.util.zip.ZipFile(forgeArchive.get().asFile).withCloseable { archive ->
            classes.visit { entry ->
                if (!entry.directory && archive.getEntry(entry.relativePath.pathString) == null) {
                    throw new GradleException("Forge 发行包缺少 ${entry.relativePath}")
                }
            }
        }
    }
}
tasks.named('check') { dependsOn 'verifyForgeJar' }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
