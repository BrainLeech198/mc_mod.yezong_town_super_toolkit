name: Build platform packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: forge
            java: '17'
            directory: .
            tasks: clean selfTest build
          - platform: fabric
            java: '25'
            directory: platforms/fabric-1.20.1
            tasks: clean build
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build and verify final package
        working-directory: ${{ matrix.directory }}
        run: ./gradlew ${{ matrix.tasks }} --no-daemon --console=plain
      - name: Check public distribution contents
        run: python3 scripts/verify_package.py --platform ${{ matrix.platform }} --directory ${{ matrix.directory }}/build/libs
      - name: Record package source
        working-directory: ${{ matrix.directory }}/build/libs
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          printf 'commit=%s\nplatform=%s\nrun=%s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$PLATFORM" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > "build-info-$PLATFORM.txt"
          sha256sum yzt_super-*-mc1.20.1-"$PLATFORM".jar > "SHA256SUMS-$PLATFORM.txt"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: package-${{ matrix.platform }}
          path: |
            ${{ matrix.directory }}/build/libs/yzt_super-*-mc1.20.1-${{ matrix.platform }}.jar
            ${{ matrix.directory }}/build/libs/build-info-${{ matrix.platform }}.txt
            ${{ matrix.directory }}/build/libs/SHA256SUMS-${{ matrix.platform }}.txt
          if-no-files-found: error
          retention-days: 14
